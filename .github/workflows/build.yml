name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases from main

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Version = <major.minor from version.txt>.<run number>, e.g. 0.1.7. The app compares this
      # number with the latest GitHub release to decide whether an update is available.
      - name: Compute version
        shell: pwsh
        run: |
          $prefix = (Get-Content version.txt -Raw).Trim()
          "VERSION=$prefix.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build PaperPilot.sln -c Release -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test tests/PaperPilot.Core.Tests -c Release

      - name: Publish (self-contained, single exe)
        run: >
          dotnet publish src/PaperPilot/PaperPilot.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ env.VERSION }} -o publish

      # Start the real exe on the runner's desktop, give it time, then check the log says it got
      # all the way through startup. A screenshot is kept so the UI can be looked at.
      - name: Smoke test (launch the exe)
        shell: pwsh
        run: |
          $logDir = Join-Path $env:LOCALAPPDATA "PaperPilot\logs"
          Remove-Item -Recurse -Force (Join-Path $env:LOCALAPPDATA "PaperPilot") -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath publish/PaperPilot.exe -ArgumentList "--smoke-test" -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          New-Item -ItemType Directory -Force smoke | Out-Null
          $bmp.Save("smoke/screen.png")
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          Write-Host "Process still running after 25 s: $alive"
          Copy-Item (Join-Path $logDir "smoke-*.png") smoke/ -ErrorAction SilentlyContinue
          Get-ChildItem $logDir -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName } | Tee-Object smoke/log.txt
          $log = Get-Content smoke/log.txt -Raw -ErrorAction SilentlyContinue
          if (-not $alive -or -not $log -or $log -notmatch "Startup: ready" -or $log -notmatch "Smoke: done" -or $log -match "ERROR") {
            Write-Error "Paper Pilot did not start cleanly."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ env.VERSION }}
          path: smoke/

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/PaperPilot.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  PaperPilot.exe" | Out-File -Encoding ascii -NoNewline publish/PaperPilot.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PaperPilot-win-x64-${{ env.VERSION }}
          path: publish/

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B | Out-File -Encoding utf8 notes.md
          # GitHub occasionally refuses a release with a transient 403; retry a few times.
          for ($i = 1; $i -le 4; $i++) {
            gh release create "v${{ env.VERSION }}" publish/PaperPilot.exe publish/PaperPilot.exe.sha256 `
              --title "Paper Pilot ${{ env.VERSION }}" --notes-file notes.md --target "${{ github.sha }}"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            gh release delete "v${{ env.VERSION }}" --yes --cleanup-tag 2>$null
            Start-Sleep -Seconds (10 * $i)
          }
          exit 1
