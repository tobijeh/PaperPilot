name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases from main

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Version = <major.minor from version.txt>.<run number>, e.g. 0.1.7. The app compares this
      # number with the latest GitHub release to decide whether an update is available.
      - name: Compute version
        shell: pwsh
        run: |
          $prefix = (Get-Content version.txt -Raw).Trim()
          "VERSION=$prefix.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Build
        run: dotnet build PaperPilot.sln -c Release -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test tests/PaperPilot.Core.Tests -c Release

      - name: Publish (self-contained, single exe)
        run: >
          dotnet publish src/PaperPilot/PaperPilot.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${{ env.VERSION }} -o publish

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ env.VERSION }}" installer\PaperPilot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item publish\PaperPilot-Setup.exe | Format-Table Name, Length

      # Install with the real setup (silently, as the in-app updater does), run the installed app
      # through every Settings page and bubble state, then uninstall. Fails the build (so nothing is
      # released) if any step goes wrong. Pictures and the log are kept as an artifact.
      - name: Smoke test (install, run, uninstall)
        shell: pwsh
        run: |
          $data = Join-Path $env:LOCALAPPDATA "PaperPilot"
          $logDir = Join-Path $data "logs"
          $app = Join-Path $env:LOCALAPPDATA "Programs\Paper Pilot"
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force smoke | Out-Null

          $s = Start-Process publish\PaperPilot-Setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /nolaunch=1" -PassThru -Wait
          Write-Host "Setup exit code: $($s.ExitCode)"
          $exe = Join-Path $app "PaperPilot.exe"
          $uninstall = Get-ChildItem HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall |
            Get-ItemProperty | Where-Object DisplayName -eq "Paper Pilot"
          Write-Host "Installed exe: $(Test-Path $exe); Installed apps entry: $($uninstall.DisplayName) $($uninstall.DisplayVersion)"
          if ($s.ExitCode -ne 0 -or -not (Test-Path $exe) -or -not $uninstall) { Write-Error "Install failed."; exit 1 }

          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("smoke/screen.png")
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force; Start-Sleep -Seconds 1 }
          Write-Host "Process still running after 25 s: $alive"
          Copy-Item (Join-Path $logDir "smoke-*.png") smoke/ -ErrorAction SilentlyContinue
          Get-ChildItem $logDir -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName } | Tee-Object smoke/log.txt
          $log = Get-Content smoke/log.txt -Raw -ErrorAction SilentlyContinue
          if (-not $alive -or -not $log -or $log -notmatch "Startup: ready" -or $log -notmatch "Smoke: done" -or $log -match "ERROR") {
            Write-Error "Paper Pilot did not start cleanly."
            exit 1
          }

          $u = Start-Process (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -PassThru -Wait
          Start-Sleep -Seconds 3
          Write-Host "Uninstall exit code: $($u.ExitCode); exe still there: $(Test-Path $exe)"
          if ($u.ExitCode -ne 0 -or (Test-Path $exe)) { Write-Error "Uninstall failed."; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ env.VERSION }}
          path: smoke/

      - name: Checksums
        shell: pwsh
        run: |
          foreach ($f in "PaperPilot.exe", "PaperPilot-Setup.exe") {
            $hash = (Get-FileHash "publish/$f" -Algorithm SHA256).Hash.ToLower()
            "$hash  $f" | Out-File -Encoding ascii -NoNewline "publish/$f.sha256"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PaperPilot-win-x64-${{ env.VERSION }}
          path: |
            publish/PaperPilot-Setup.exe
            publish/PaperPilot.exe
            publish/*.sha256

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $commit = git log -1 --pretty=%B
          @"
          **Install:** download **PaperPilot-Setup.exe** below and run it. (Windows may say "Windows protected your PC" because Paper Pilot isn't code-signed: click *More info*, then *Run anyway*.) Already installed? Paper Pilot updates itself: use *Restart to update*.

          ---
          $commit
          "@ | Out-File -Encoding utf8 notes.md
          # GitHub occasionally refuses a release with a transient 403; retry a few times.
          for ($i = 1; $i -le 4; $i++) {
            gh release create "v${{ env.VERSION }}" `
              publish/PaperPilot-Setup.exe publish/PaperPilot-Setup.exe.sha256 `
              publish/PaperPilot.exe publish/PaperPilot.exe.sha256 `
              --title "Paper Pilot ${{ env.VERSION }}" --notes-file notes.md --target "${{ github.sha }}"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            gh release delete "v${{ env.VERSION }}" --yes --cleanup-tag 2>$null
            Start-Sleep -Seconds (10 * $i)
          }
          exit 1
